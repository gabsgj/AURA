# DEPRECATED: Docker Compose configuration
# This file is kept for reference but is not used in the current deployment
# The client requires non-Docker deployment. See DEPLOYMENT.md for current instructions.

version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      - VITE_API_ORIGIN=http://localhost:5000
      - VITE_DEMO_MODE=false
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped
